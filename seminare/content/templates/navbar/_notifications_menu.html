<div class="relative inline-block" data-controller="dropdown">
  <button type="button"
          class="inline-flex w-full items-center gap-x-1 rounded-md px-3 py-2 hover:bg-primary-dark"
          id="menu-button-notifications" data-dropdown-target="button" aria-expanded="false" aria-haspopup="true" data-action="click->dropdown#toggle">
    <iconify-icon icon="mdi:bell{% if has_unread_notifications %}-notification{% endif %}" width="none" class="size-4"></iconify-icon>
    {% if not mobile %}<iconify-icon icon="mdi:chevron-down" width="none" class="size-4"></iconify-icon>{% endif %}
  </button>
  <div class="hidden absolute right-0 z-20 p-4 mt-2 w-60 origin-top-right rounded-md bg-white shadow-lg border"
       role="menu" aria-orientation="vertical" aria-labelledby="menu-button-notifications" tabindex="-1"
       data-dropdown-target="dropdown"
  >
    <div class="-m-2 text-gray-800">
      {% for notification in notifications %}
        <a href="{% url 'notification_seen' notification.id %}"
          class="group block p-2 rounded cursor-pointer hover:bg-gray-50">
          <div class="flex gap-x-2 items-center {% if notification.viewed_at %}group-hover:text-primary{% else %}text-primary{% endif %}">
            {% if not notification.viewed_at %}
              <span class="size-2 rounded-full bg-primary"></span>
            {% endif %}
            {{ notification.title }}
          </div>
          <div class="font-normal">
            {{ notification.content }}
          </div>
          <div class="flex justify-end text-xs font-normal">
            <span>{{ notification.created_at }}</span>
          </div>
        </a>
      {% empty %}
        <div class="group p-2 rounded font-normal text-center">
          Všetko už máš prečítané 🎉
        </div>
      {% endfor %}
    </div>
    <hr class="my-4 -mx-2"/>
    {% include "navbar/_group_items.html" with group_items=notification_section %}
  </div>
</div>
